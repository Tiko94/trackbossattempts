<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Definitions for clipping mask -->
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="100" cy="100" r="90" />
    </clipPath>
  </defs>

  <!-- Main Avatar Dark Grey Circle Background -->
  <circle cx="100" cy="100" r="90" fill="#4d4d4d" />

  <!-- Knight Illustration Group (Clipped to main circle) -->
  <g clip-path="url(#avatar-clip)">
    <!-- Body / Armor Base -->
    <path d="M 20,185 C 30,140 60,120 100,120 C 140,120 170,140 180,185 Z" fill="#7a7a7a" />

    <!-- Left Shoulder Contour & Shadow -->
    <path d="M 20,185 C 30,140 60,120 80,120 C 65,135 55,160 52,185 Z" fill="#666666" />

    <!-- Right Shoulder Pauldron -->
    <path d="M 130,132 C 145,120 160,125 175,145 C 160,150 145,145 130,132 Z" fill="#888888" stroke="#4d4d4d" stroke-width="3" />
    <path d="M 135,145 C 150,135 165,140 180,160 C 165,165 150,160 135,145 Z" fill="#7a7a7a" stroke="#4d4d4d" stroke-width="3" />

    <!-- Chest Armor Lines/Plates -->
    <path d="M 65,128 Q 100,148 135,128" fill="none" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round" />
    <line x1="100" y1="138" x2="100" y2="190" stroke="#4d4d4d" stroke-width="4" stroke-linecap="round" />
    <path d="M 72,150 Q 100,168 128,150" fill="none" stroke="#4d4d4d" stroke-width="3" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M 82,110 L 118,110 L 114,130 Q 100,135 86,130 Z" fill="#666666" />

    <!-- Helmet Base -->
    <path d="M 100,38 C 125,38 135,60 135,80 C 135,110 120,126 100,126 C 80,126 65,110 65,80 C 65,60 75,38 100,38 Z" fill="#888888" />

    <!-- Helmet Crest / Ridge Center Line -->
    <path d="M 100,38 Q 98,70 100,95" fill="none" stroke="#666666" stroke-width="3" stroke-linecap="round" />
    <path d="M 96,40 Q 100,35 104,40 L 102,75 L 98,75 Z" fill="#999999" />

    <!-- Visor Slot -->
    <path d="M 75,76 Q 100,88 125,76 Q 100,80 75,76 Z" fill="#333333" stroke="#4d4d4d" stroke-width="2" stroke-linejoin="round" />

    <!-- Helmet Ventilation Slots -->
    <line x1="87" y1="92" x2="87" y2="106" stroke="#4d4d4d" stroke-width="3.5" stroke-linecap="round" />
    <line x1="93" y1="93" x2="93" y2="108" stroke="#4d4d4d" stroke-width="3.5" stroke-linecap="round" />
    <line x1="107" y1="93" x2="107" y2="108" stroke="#4d4d4d" stroke-width="3.5" stroke-linecap="round" />
    <line x1="113" y1="92" x2="113" y2="106" stroke="#4d4d4d" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Plus Button Overlay (Bottom-Right) -->
  <g transform="translate(150, 150)">
    <circle cx="0" cy="0" r="30" fill="#1e2124" />
    <circle cx="0" cy="0" r="27" fill="#0084ff" />
    <path d="M -10,0 L 10,0 M 0,-10 L 0,10" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
